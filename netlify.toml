[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >= 22.12.0. Pinned so a change to Netlify's default
  # image cannot silently drop below that and fail the build.
  NODE_VERSION = "22"

# No apex/www redirect here on purpose.
#
# Netlify treats buenavistaturf.com as the primary domain and redirects
# www -> apex itself. An apex -> www rule in this file would fight that and
# produce a redirect loop. Netlify refuses to make www primary — adding
# "www.buenavistaturf.com" is silently rewritten to the apex — so the apex is
# canonical and the site config matches it.
